name: Release Build

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
    # 1. Cloning the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install PHP and Composer
    # The PHP version is the minimum required by the oldest supported MantisBT
    # release (PHP_MIN_VERSION of MantisBT 2.26, the floor declared in
    # TelegramBot.php::register()), so that composer verifies the dependencies
    # against the oldest platform the built archive has to run on.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.2'
        extensions: mbstring, intl, zip
        tools: composer

    # 3. Installing dependencies
    - name: Install dependencies
      run: composer install --no-dev --optimize-autoloader

    # 4. Creating an archive
    - name: Create Release Archive
      run: |
        zip -r TelegramBot-${{ github.event.release.tag_name }}.zip ./TelegramBot -x ".git*" "tests/*" ".github/*"

    # 5. Uploading the archive to the release
    - name: Upload to Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" "TelegramBot-${{ github.event.release.tag_name }}.zip" --repo "${{ github.repository }}"
