name: Release Build

on:
  release:
    types:
      - published

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
    # 1. Cloning the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Install PHP and Composer
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, zip
        tools: composer

    # 3. Installing dependencies
    - name: Install dependencies
      run: composer install --no-dev --optimize-autoloader

    # 4. Creating an archive
    - name: Create Release Archive
      run: |
        zip -r TelegramBot-${{ github.event.release.tag_name }}.zip ./TelegramBot -x ".git*" "tests/*" ".github/*"

    # 5. Uploading the archive to the release
    - name: Upload to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./TelegramBot-${{ github.event.release.tag_name }}.zip
        asset_name: TelegramBot-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip
